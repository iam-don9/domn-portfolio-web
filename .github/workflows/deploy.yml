name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudbase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: ""

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login to CloudBase
        run: tcb login --apiKeyId "$CLOUDBASE_SECRET_ID" --apiKey "$CLOUDBASE_SECRET_KEY"
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}

      - name: Deploy static hosting files
        run: >-
          tcb hosting deploy ./dist
          -e "$CLOUDBASE_ENV_ID"
          --verify
          --concurrency 5
          --ignore "media/featured/shi-er-zhan.png"
        env:
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}

      - name: Deploy slow asset separately
        run: >-
          tcb hosting deploy ./dist/media/featured/shi-er-zhan.png
          media/featured/shi-er-zhan.png
          -e "$CLOUDBASE_ENV_ID"
          --verify
          --concurrency 1
          --retry-count 5
          --retry-interval 5000
        env:
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
